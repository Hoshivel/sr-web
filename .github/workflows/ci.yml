# 主分支的驗證。
#
# `npm run build` ＝ `astro check && astro build`，也就是 `.hoshi-build.yaml` 的
# `test` 指向的同一個 script。這裡直接呼叫它而不是繞道 `hoshi test`，是因為
# 本倉庫沒有任何 Go——為了跑一個 npm script 而先裝 Go、再裝 hoshi，換不到
# 任何額外保證。呼叫的仍然是同一份正本（`package.json` 的 scripts）。
#
# **`astro check` 是這個倉庫唯一的型別關卡**，所以這裡跑的是 `build` 而不是
# `preview`——用後者會安靜地跳過型別檢查。
name: CI

on:
  push:
    branches: [main]
  # 開了 PR 就在合併前先驗一次，但**草稿不跑**（下面每個 job 的 `if`）。
  # 迭代期間開成 draft，改好再標 ready for review——那一刻才觸發。
  #
  # 這與「工作分支的頻繁推送不該花 CI」並不衝突：沒有開 PR 的分支不會觸發，
  # 開了 PR 但還是草稿的也不會。換到的是**合併前就知道壞了**，
  # 而不是像 2026-08-08 那次要等合併後才發現 hoshi-deploy 是紅的。
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# 同一個 PR 上再推一次，就取消前一次還沒跑完的執行，只留最後一顆 commit 的結果。
#
# **`main` 不取消**（所以用 event_name 判斷，不是無條件 true）：那裡的每一次
# 執行都對應一次真的合併，取消掉就沒有任何地方記得那次合併驗過沒有——
# 而那正是加 CI 想消滅的狀態。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # package.json 的 engines 要求 >=22.12.0。
          node-version: "22"
          cache: npm

      # `npm ci` 而不是 `npm install`：要驗的是 lockfile 裡那一組版本，
      # 不是解析當下恰好最新的那一組。
      - run: npm ci

      - run: npm run build

  # **本倉庫是公開的，所以掃描與 `build` 同時起跑**，不等它綠燈。
  #
  # 公開倉庫的 Actions 分鐘數不計費，所以「基礎驗證紅燈時整組 skipped、
  # 省下執行器時間」在這裡換不到任何東西，只換到更晚才知道掃描的結論。
  # 代價要講清楚：建置壞掉時 CodeQL 的 autobuild 會吐同一個錯誤換一種包裝，
  # 所以一顆真的紅燈會伴隨一顆指向同一個根因的紅燈。
  #
  # **私有倉庫維持 `needs:` 那道閘**——那裡的分鐘數要付錢。兩種形狀是刻意的，
  # 不是漂移；判準與理由見 workspace `AGENTS.md` §1.9.1。
  #
  # 掃描本身的定義在 `security.yml`，那支同時還掛著每週排程。
  security:
    # **只在 main（與手動）跑，PR 上不掃。** 掃描找到的東西是「處理一次就
    # 結束」的那一類，不是每個 PR 都要重新確認一次的；而它是這條流水線上
    # 最慢的一段，掛在 PR 上換到的回饋遠少於它拖長的等待。
    #
    # 用 `!= 'pull_request'` 而不是 `== 'push'`：後者會順手把
    # `workflow_dispatch` 的手動掃描也關掉，而那是要用的。
    if: github.event_name != 'pull_request'
    name: 安全掃描
    # 閘門對公開倉庫也成立了（裁示 2026-08-16）：掃描要先等基礎驗證綠。
    # 取代 workspace decisions/infrastructure/公開倉庫的掃描不經閘門.md
    needs: [build]
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      # 呼叫端的權限是被呼叫 job 的**上限**，所以這裡要給到聯集。
      # CodeQL 與 Trivy 上傳 SARIF 要 security-events: write；
      security-events: write
      # CodeQL 在**私有倉庫**要讀本次 run 的資訊，少了它掃描全成功、
      # job 卻以 `Resource not accessible by integration` 收場。
      actions: read
    # 掃描要建置本倉庫，而建置可能需要 HOSHIVEL_CI_TOKEN（私有 module）。
    secrets: inherit
